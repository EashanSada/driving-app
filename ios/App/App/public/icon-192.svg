<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3B3" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8C6D46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C5A880" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Background with Rounded Corners for Mobile Platforms -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Outer Telematics Ring (270 degree Radian Arc) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#292524" stroke-width="12" />
  <path d="M 143 369 A 160 160 0 1 1 369 369" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Radian Angle / Precision Apex -->
  <path d="M 256 120 L 256 256 L 360 256" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Core Pivot -->
  <circle cx="256" cy="256" r="16" fill="url(#goldGrad)" />

  <!-- Dynamic Speed Tick Markers -->
  <circle cx="256" cy="96" r="4" fill="#C5A880" />
  <circle cx="396" cy="180" r="4" fill="#C5A880" />
  <circle cx="416" cy="256" r="4" fill="#C5A880" />
  <circle cx="369" cy="369" r="6" fill="#E5D3B3" />
  <circle cx="143" cy="369" r="6" fill="#8C6D46" />
</svg>
