<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF9F5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <title>RadianDrive | Precision Telematics & Safety Platform</title>

    <!-- Luxury Typography: Outfit, Syncopate, Cinzel, Plus Jakarta Sans, and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <!-- PWA Manifest & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RadianDrive" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Custom Luxury Texture Styles -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-[#FBF9F5] text-stone-900 min-h-screen font-sans antialiased selection:bg-[#C5A880] selection:text-stone-950 overflow-x-hidden">
    <div id="root"></div>

    <!-- Vanilla JS Modular Telematics Libraries -->
    <script src="/js/backend.js"></script>
    <script src="/js/telematics.js"></script>
    <script src="/js/app.js"></script>

    <!-- React Main App Entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
            })
            .catch(err => console.log('Service Worker registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
